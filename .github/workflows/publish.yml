name: Publish wuffle PWA

on:
  workflow_dispatch:
  push:
    branches: [main]      # redeploy on any change here (the shell, or a refreshed wuffle.html seed)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The app is the committed wuffle.html seed (auditable's release doesn't carry wuffle.html yet).
      - name: Assemble the PWA
        run: |
          node publish.mjs
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.svg .nojekyll _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
