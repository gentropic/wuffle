name: Publish wuffle PWA

on:
  workflow_dispatch:
  push:
    branches: [main]      # redeploy on any change here (the shell, or a refreshed wuffle.html seed)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # BUILD uploads the site; DEPLOY (its own job) publishes it — GitHub's documented pattern, as
  # micro's. One job doing both asked for the artifact a moment after uploading it and often found
  # none ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The app is the committed wuffle.html seed (auditable's release doesn't carry wuffle.html yet).
      - name: Assemble the PWA
        run: |
          node publish.mjs
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js icon.svg .nojekyll _site/
          # STARSTER 93, wuffle's imagined 1993 ancestor, in DOSBox at /wuffle/1993/ — assembled by auditable's
          # tools/starster/web/publish.mjs (the page, dos/STARSTER.EXE + sample + README.TXT, emulators/ pinned)
          cp -r 1993 _site/

      # The manual (the LuaLaTeX book, ~6 MB) is built on Arthur's machine and attached to an auditable
      # release by hand, so it rides in from the newest release that carries one — never committed here
      # (6 MB per rebuild would pile up in this repo's history). wuffle's Help → "The manual" links to it.
      - name: Fetch the wuffle manual (PDF)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --repo gentropic/auditable --limit 20 --json tagName -q '.[].tagName'); do
            if gh release download "$tag" --repo gentropic/auditable --pattern 'wuffle-manual.pdf' --dir _site --clobber 2>/dev/null; then
              echo "wuffle-manual.pdf from $tag"; break
            fi
          done
          [ -f _site/wuffle-manual.pdf ] || echo "::warning::no auditable release carries wuffle-manual.pdf — Help → The manual will 404"

      # v4+ leaves hidden files out unless asked, so .nojekyll is asked for.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
