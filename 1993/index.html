<style>
  /* Switchboard (ext/switchboard/SPEC.md): basalt first, equipment grey on a light preference */
  :root {
    --w-bg-deep:#0E1012; --w-bg:#15171A; --w-bg-raised:#1D2024; --w-bg-bright:#25282D;

  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --w-bg-deep:#C2C1BE; --w-bg:#D2D1CE; --w-bg-raised:#E4E3E1; --w-bg-bright:#EDECEB;
    --w-text:#232322; --w-text-mid:#504F4C; --w-text-soft:#5A5856; --w-border:#B3B1AD; --w-border-soft:#C6C4C1; --w-rule:#A5A3A0;
    --w-orange:#8B3F00; --w-orange-soft:#FDE0CF; --w-blue:#005C97; --w-blue-soft:#DCEBF5; --w-green:#00602B; --w-green-soft:#DCEFE2;
    --w-yellow:#6F5700; --w-red:#99191E; --w-red-soft:#F6DCDB; --w-violet:#793A8D; --w-violet-soft:#F2DFF7; color-scheme: light; } }
  :root[data-theme="light"] {
    --w-bg-deep:#C2C1BE; --w-bg:#D2D1CE; --w-bg-raised:#E4E3E1; --w-bg-bright:#EDECEB;
    --w-text:#232322; --w-text-mid:#504F4C; --w-text-soft:#5A5856; --w-border:#B3B1AD; --w-border-soft:#C6C4C1; --w-rule:#A5A3A0;
    --w-orange:#8B3F00; --w-orange-soft:#FDE0CF; --w-blue:#005C97; --w-blue-soft:#DCEBF5; --w-green:#00602B; --w-green-soft:#DCEFE2;
    --w-yellow:#6F5700; --w-red:#99191E; --w-red-soft:#F6DCDB; --w-violet:#793A8D; --w-violet-soft:#F2DFF7; color-scheme: light; }
  /* the GCU components read their own variables: mapped onto ours */
  body {
    --rails-bg:var(--w-bg-deep); --rails-surface:var(--w-bg-raised); --rails-chrome:var(--w-bg-bright); --rails-border:var(--w-border);
    --rails-border-strong:var(--w-rule); --rails-text:var(--w-text); --rails-text-dim:var(--w-text-mid); --rails-text-faint:var(--w-text-soft);
    --rails-accent:var(--w-orange); --rails-accent-bg:var(--w-orange-soft); --rails-danger:var(--w-red); --rails-font-mono:var(--w-mono);
    --ui-bg:var(--w-bg-raised); --ui-bg-raised:var(--w-bg-raised); --ui-bg-hover:var(--w-bg-bright); --ui-bg-selected:var(--w-violet-soft);
    --ui-fg:var(--w-text); --ui-fg-muted:var(--w-text-mid); --ui-fg-error:var(--w-red); --ui-fg-accent:var(--w-orange);
    --ui-border:var(--w-border); --ui-border-focus:var(--w-blue); --ui-font:var(--w-sans); --ui-font-size:13px;
    margin:0; height:100vh; overflow:hidden; background:var(--w-bg); color:var(--w-text); font:13px/1.4 var(--w-sans);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }

  /* the shell: the bar, the work, the status line */
  #wb { height:100vh; display:grid; grid-template-rows:30px 1fr 22px; }
  .bar { display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--w-bg-raised); border-bottom:1px solid var(--w-border); }
  .brand { font:700 12px var(--w-mono); color:var(--w-orange); margin-right:8px; white-space:nowrap; }
  .brand small { color:var(--w-text-soft); font-weight:400; margin-left:6px; }
  #menus { flex:1; min-width:0; }
  .chip { font:11px var(--w-mono); color:var(--w-blue); border:1px solid var(--w-border); border-radius:3px; padding:0 6px; cursor:help; white-space:nowrap; }
  #work { min-height:0; position:relative; }
  .status { display:flex; gap:18px; align-items:center; padding:0 10px; font:11px var(--w-mono); color:var(--w-text-soft); background:var(--w-bg-raised); border-top:1px solid var(--w-border); white-space:nowrap; overflow:hidden; }
  .status #msg { flex:1; overflow:hidden; text-overflow:ellipsis; color:var(--w-text-mid); }
  .status kbd { font:inherit; color:var(--w-orange); }

  /* the drives */
  .drives { height:100%; overflow:auto; background:var(--w-bg); font:12px var(--w-mono); padding:4px 0 12px; outline:none; user-select:none; }
  .drives .grp { padding:8px 10px 2px; color:var(--w-text-soft); font:600 10px var(--w-sans); text-transform:uppercase; letter-spacing:.08em; display:flex; gap:6px; align-items:center; }
  .drives .grp .dot { width:7px; height:7px; border-radius:50%; background:var(--w-border); }
  .drives .grp .dot.on { background:var(--w-green); }
  .drives .row { display:flex; align-items:center; gap:6px; padding:2px 10px 2px 14px; cursor:default; white-space:nowrap; }
  .drives .row.drive { color:var(--w-text); font-weight:700; padding-left:10px; }
  .drives .row.drive i { font-style:normal; color:var(--w-text-soft); font-weight:400; overflow:hidden; text-overflow:ellipsis; }
  .drives .row.file { padding-left:26px; color:var(--w-text-mid); }
  .drives .row.file .n { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .drives .row.file .s { color:var(--w-text-soft); }
  .drives .row.empty { padding-left:26px; color:var(--w-text-soft); font-style:italic; }
  .drives .row:hover { background:var(--w-bg-bright); }
  .drives .row.sel { background:var(--w-violet-soft); color:var(--w-violet); }
  .drives .row.dropping { outline:1px dashed var(--w-violet); outline-offset:-1px; }
  .drives:focus .row.sel { outline:1px solid var(--w-violet); outline-offset:-1px; }

  /* a machine: its strip, its screen */
  .pc { height:100%; display:grid; grid-template-rows:28px 1fr; background:#0B0C0D; }   /* round a picture tube: dark, whatever the theme */
  .pc .strip { display:flex; align-items:center; gap:8px; padding:0 8px; background:var(--w-bg-raised); border-bottom:1px solid var(--w-border); font:11px var(--w-mono); color:var(--w-text-mid); }
  .pc .strip .led { width:8px; height:8px; border-radius:50%; background:var(--w-border); flex:none; }
  .pc .strip .led.on { background:var(--w-green); box-shadow:0 0 5px var(--w-green); }
  .pc .strip .led.turbo.on { background:var(--w-yellow); box-shadow:0 0 5px var(--w-yellow); }
  .pc .strip .led.disk.on { background:var(--w-orange); box-shadow:0 0 5px var(--w-orange); }
  .pc .strip label { display:flex; align-items:center; gap:5px; }
  .pc .strip select, .pc .strip button { font:11px var(--w-mono); background:var(--w-bg-bright); color:var(--w-text); border:1px solid var(--w-border); border-radius:3px; padding:1px 6px; height:20px; }
  .pc .strip button:hover { border-color:var(--w-orange); color:var(--w-orange); }
  .pc .strip .grow { flex:1; }
  .pc .strip .state { color:var(--w-text-soft); }
  .pc .screen { position:relative; min-height:0; display:grid; place-items:center; overflow:hidden; outline:none; }
  .pc canvas { display:block; background:#000; outline:none; cursor:default; }
  .pc.focused .screen { box-shadow:inset 0 0 0 2px var(--w-orange); }
  .pc .screen.drop { box-shadow:inset 0 0 0 2px var(--w-violet); }
  .pc .off { position:absolute; inset:0; display:grid; place-items:center; color:var(--w-text-soft); font:12px var(--w-mono); text-align:center; }
  .pc .off button { font:600 13px var(--w-sans); color:var(--w-orange); background:var(--w-orange-soft); border:1px solid var(--w-orange); border-radius:3px; padding:6px 16px; margin-top:10px; cursor:pointer; }
  .pc .paused { position:absolute; right:10px; bottom:8px; font:10px var(--w-mono); color:var(--w-text-soft); }

  /* an editor */
  .ed { height:100%; display:grid; grid-template-rows:28px 1fr; background:var(--w-bg); }
  .ed .strip { display:flex; align-items:center; gap:8px; padding:0 8px; background:var(--w-bg-raised); border-bottom:1px solid var(--w-border); font:11px var(--w-mono); color:var(--w-text-mid); }
  .ed .strip .grow { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ed .strip .dirty { color:var(--w-yellow); }
  .ed .strip button { font:11px var(--w-mono); background:var(--w-bg-bright); color:var(--w-text); border:1px solid var(--w-border); border-radius:3px; padding:1px 8px; height:20px; }
  .ed .strip button:hover:not(:disabled) { border-color:var(--w-orange); color:var(--w-orange); }
  .ed .strip button:disabled { opacity:.45; }
  .ed textarea { width:100%; height:100%; resize:none; border:0; outline:none; padding:8px 10px; background:var(--w-bg); color:var(--w-text); font:13px/1.45 var(--w-mono); tab-size:8; white-space:pre; }
  .ed.focused textarea { box-shadow:inset 0 0 0 2px var(--w-orange); }
  .ed .strip .pos { color:var(--w-text-soft); }

  /* the host-key overlay: which pane is where */
  .hosthint { position:fixed; left:50%; top:40px; transform:translateX(-50%); z-index:60; background:var(--w-bg-raised); border:1px solid var(--w-orange); border-radius:4px; padding:6px 12px; font:12px var(--w-mono); color:var(--w-text); box-shadow:0 6px 18px rgba(0,0,0,.45); pointer-events:none; }
  .hosthint b { color:var(--w-orange); }
  .hosthint span + span { margin-left:14px; }
  .help-table { font:12px var(--w-mono); border-collapse:collapse; }
  .help-table td { padding:2px 12px 2px 0; vertical-align:top; }
  .help-table td:first-child { color:var(--w-orange); white-space:nowrap; }

  /* ================================================================ THE 1993 LOOK (the default; View › Look)
     A 16-colour desktop of the day, drawn in CSS: raised grey bevels, navy for what is active, white work
     areas, a title bar over the menu bar. Fonts are only named as a preference — whoever has the bitmap
     system fonts installed sees them, everyone else a plain sans and a plain mono. */
  html[data-look="1993"] {
    --k-face:#C0C0C0; --k-hi:#FFFFFF; --k-lo:#808080; --k-dk:#000000; --k-navy:#000080; --k-teal:#008080; --k-win:#FFFFFF;
    --k-sans:"MS Sans Serif","Microsoft Sans Serif",Arial,Helvetica,sans-serif; --k-mono:Fixedsys,Terminal,"Lucida Console",Consolas,monospace;
    --raised: inset -1px -1px var(--k-dk), inset 1px 1px var(--k-hi), inset -2px -2px var(--k-lo), inset 2px 2px var(--k-face);
    --sunken: inset 1px 1px var(--k-lo), inset -1px -1px var(--k-hi), inset 2px 2px var(--k-dk), inset -2px -2px var(--k-face);
    color-scheme: light;
  }
  html[data-look="1993"] body {
    --rails-bg:var(--k-teal); --rails-surface:var(--k-win); --rails-chrome:var(--k-face); --rails-border:var(--k-dk); --rails-border-strong:var(--k-dk);
    --rails-text:#000; --rails-text-dim:#000; --rails-text-faint:var(--k-lo); --rails-accent:var(--k-navy); --rails-accent-bg:rgba(0,0,128,.25); --rails-font-mono:var(--k-sans);
    --ui-bg:var(--k-win); --ui-bg-raised:var(--k-face); --ui-bg-hover:var(--k-navy); --ui-bg-selected:var(--k-navy); --ui-fg:#000; --ui-fg-muted:var(--k-lo);
    --ui-fg-accent:var(--k-navy); --ui-border:var(--k-dk); --ui-border-focus:var(--k-dk); --ui-font:var(--k-sans); --ui-font-size:12px; --ui-border-radius:0; --ui-shadow:none;
    background:var(--k-teal); color:#000; font:12px var(--k-sans);
  }
  html[data-look="1993"] #wb { grid-template-rows:auto 1fr auto; }
  /* the title bar, then the menu bar */
  html[data-look="1993"] .bar { display:grid; grid-template-columns:1fr auto; align-items:center; padding:0; gap:0; background:var(--k-win); border-bottom:1px solid var(--k-dk); }
  html[data-look="1993"] .brand { grid-column:1 / -1; margin:0; height:20px; line-height:20px; text-align:center; background:var(--k-navy); color:#fff; font:bold 12px var(--k-sans); border-bottom:1px solid var(--k-dk); }
  html[data-look="1993"] .brand small { color:#fff; font-weight:bold; }
  html[data-look="1993"] #menus { height:20px; }
  html[data-look="1993"] .gcu-menubar-trigger { color:#000; font:12px var(--k-sans); padding:0 7px; height:20px; border-radius:0; }
  html[data-look="1993"] .gcu-menubar-trigger:hover, html[data-look="1993"] .gcu-menubar-trigger.gcu-menubar-focused,
  html[data-look="1993"] .gcu-menubar-trigger.gcu-menubar-active { background:var(--k-navy); color:#fff; }
  html[data-look="1993"] .chip { margin-right:6px; border:0; color:var(--k-lo); font:11px var(--k-sans); }
  /* pull-downs: white, a black line round them, navy for the item under the cursor */
  html[data-look="1993"] .gcu-menu { background:var(--k-win); border:1px solid var(--k-dk); border-radius:0; box-shadow:2px 2px 0 var(--k-dk); padding:1px 0; font:12px var(--k-sans); color:#000; }
  html[data-look="1993"] .gcu-menu-item { border-radius:0; color:#000; }

  html[data-look="1993"] .gcu-menu-item.gcu-menu-active .gcu-menu-shortcut, html[data-look="1993"] .gcu-menu-item.gcu-menu-active .gcu-menu-arrow { color:#fff; }
  html[data-look="1993"] .gcu-menu-disabled { color:var(--k-lo) !important; }
  html[data-look="1993"] .gcu-menu-danger { color:#000; }
  html[data-look="1993"] .gcu-menu-sep { background:var(--k-dk); height:1px; margin:3px 0; }
  /* the panes: each stack a window — its tabs the title bar (the one in front navy), a black frame round it */
  html[data-look="1993"] .rails-root { font:12px var(--k-sans); }
  html[data-look="1993"] .rails-stack { box-shadow:inset 0 0 0 1px var(--k-dk), inset 0 0 0 4px var(--k-face); }
  html[data-look="1993"] .rails-strip { background:var(--k-face); border-bottom:1px solid var(--k-dk); }
  html[data-look="1993"] .rails-tab { color:#000; border-right:1px solid var(--k-lo); font:bold 12px var(--k-sans); padding:3px 8px 3px 10px; }
  html[data-look="1993"] .rails-tab:hover { color:#000; }
  html[data-look="1993"] .rails-tab.rails-active { background:var(--k-navy); color:#fff; box-shadow:none; }
  html[data-look="1993"] .rails-tab .rails-x, html[data-look="1993"] .rails-btn-close { color:inherit; }
  html[data-look="1993"] .rails-bar:hover { background:var(--k-navy); }
  html[data-look="1993"] .rails-bar-row { border-left:1px solid var(--k-dk); }
  html[data-look="1993"] .rails-bar-col { border-top:1px solid var(--k-dk); }
  html[data-look="1993"] .rails-float { border:1px solid var(--k-dk); border-radius:0; box-shadow:var(--raised), 3px 3px 0 rgba(0,0,0,.6); background:var(--k-face); }
  html[data-look="1993"] .rails-titlebar { background:var(--k-navy); border-bottom:1px solid var(--k-dk); }
  html[data-look="1993"] .rails-titlebar-label { color:#fff; font:bold 12px var(--k-sans); letter-spacing:0; }
  html[data-look="1993"] .rails-titlebar-buttons button { background:var(--k-face); color:#000; border-radius:0; box-shadow:var(--raised); }
  /* the drives: a file manager's tree — white, black text, navy selection */
  html[data-look="1993"] .drives { background:var(--k-win); color:#000; font:12px var(--k-sans); }
  html[data-look="1993"] .drives .grp { color:#000; font:bold 11px var(--k-sans); text-transform:none; letter-spacing:0; }
  html[data-look="1993"] .drives .grp .dot { border:1px solid var(--k-dk); border-radius:0; width:8px; height:8px; background:var(--k-face); }
  html[data-look="1993"] .drives .grp .dot.on { background:#00FF00; }
  html[data-look="1993"] .drives .row.drive, html[data-look="1993"] .drives .row.file { color:#000; }
  html[data-look="1993"] .drives .row.drive i, html[data-look="1993"] .drives .row.file .s, html[data-look="1993"] .drives .row.empty { color:var(--k-lo); }
  html[data-look="1993"] .drives .row:hover { background:transparent; }

  html[data-look="1993"] .drives .row.sel .s, html[data-look="1993"] .drives .row.sel i { color:#fff; }
  html[data-look="1993"] .drives:focus .row.sel { outline:1px dotted #fff; outline-offset:-2px; }
  html[data-look="1993"] .drives .row.drive::before { content:''; width:16px; height:10px; margin-right:2px; flex:none; background:var(--k-face); box-shadow:inset 0 0 0 1px var(--k-dk), inset 0 -3px 0 var(--k-lo); }
  /* a machine's strip and an editor's: a toolbar of raised buttons */
  html[data-look="1993"] .pc .strip, html[data-look="1993"] .ed .strip { background:var(--k-face); color:#000; border-bottom:1px solid var(--k-dk); font:12px var(--k-sans); }
  html[data-look="1993"] .pc .strip .state, html[data-look="1993"] .ed .strip .pos { color:var(--k-lo); }
  html[data-look="1993"] .pc .strip button, html[data-look="1993"] .ed .strip button, html[data-look="1993"] .pc .off button {
    background:var(--k-face); color:#000; border:0; border-radius:0; box-shadow:var(--raised); font:12px var(--k-sans); padding:1px 10px; height:22px; }
  html[data-look="1993"] .pc .strip button:active, html[data-look="1993"] .ed .strip button:active:not(:disabled) { box-shadow:var(--sunken); }
  html[data-look="1993"] .pc .strip button:hover, html[data-look="1993"] .ed .strip button:hover:not(:disabled) { color:#000; }
  html[data-look="1993"] .ed .strip button:disabled { color:var(--k-lo); opacity:1; text-shadow:1px 1px var(--k-hi); }
  html[data-look="1993"] .pc .strip select { background:var(--k-win); color:#000; border:0; border-radius:0; box-shadow:var(--sunken); font:12px var(--k-sans); height:22px; padding:0 4px; }
  html[data-look="1993"] .pc .strip .led { border-radius:0; border:1px solid var(--k-dk); background:#004000; box-shadow:none; }
  html[data-look="1993"] .pc .strip .led.on { background:#00FF00; box-shadow:none; }
  html[data-look="1993"] .pc .strip .led.turbo.on { background:#FFFF00; }
  html[data-look="1993"] .pc .strip .led.disk.on { background:#FF0000; }
  html[data-look="1993"] .pc .off { color:#AAA; font:12px var(--k-mono); }
  html[data-look="1993"] .pc.focused .screen { box-shadow:inset 0 0 0 2px var(--k-navy); }
  html[data-look="1993"] .ed { background:var(--k-win); }
  html[data-look="1993"] .ed textarea { background:var(--k-win); color:#000; font:14px/1.3 var(--k-mono); }
  html[data-look="1993"] .ed.focused textarea { box-shadow:inset 0 0 0 1px var(--k-navy); }
  html[data-look="1993"] .ed .strip .dirty { color:#800000; }
  /* the status line: sunken panels on grey */
  html[data-look="1993"] .status { background:var(--k-face); color:#000; border-top:1px solid var(--k-hi); font:12px var(--k-sans); padding:2px 4px; gap:4px; }

  html[data-look="1993"] .status #msg { color:#000; }
  html[data-look="1993"] .hosthint { background:#FFFFE1; color:#000; border:1px solid var(--k-dk); border-radius:0; box-shadow:2px 2px 0 var(--k-dk); font:12px var(--k-sans); }
  html[data-look="1993"] .hosthint b, html[data-look="1993"] .help-table td:first-child { color:var(--k-navy); }
  /* boxes: grey, a navy title bar, raised buttons, sunken fields */
  html[data-look="1993"] .gcu-dialog { background:var(--k-face); color:#000; border:1px solid var(--k-dk); border-radius:0; box-shadow:var(--raised), 4px 4px 0 rgba(0,0,0,.5); }
  html[data-look="1993"] .gcu-dialog-header { background:var(--k-navy); color:#fff; border:0; margin:3px 3px 0; padding:2px 6px; }
  html[data-look="1993"] .gcu-dialog-title { color:#fff; font:bold 12px var(--k-sans); text-align:center; flex:1; }
  html[data-look="1993"] .gcu-dialog-close { background:var(--k-face); color:#000; border-radius:0; box-shadow:var(--raised); }
