/*
 * @gcu/rails — structural stylesheet
 * Layout, positioning, pointer-events, transitions. Zero colors or fonts.
 * Decorative styling lives in rails-default.css (optional) or consumer CSS.
 */

.rails-root {
  position: relative;
  overflow: hidden;
}

/* Chrome layer holds two sublayers: .rails-rails (the docked tree) and
   .rails-floats (float frames above it). Rebuilt on structural mutation. */
.rails-chrome {
  position: absolute;
  inset: 0;
}

.rails-rails {
  position: absolute;
  inset: 0;
  display: flex;
}

/* .rails-floats is a pure positioning container — NO z-index, so it does
   not create a stacking context. Each individual float sets its own root-level
   z-index (100 + float.z * 10), and its panel gets an interleaved z
   (100 + float.z * 10 + 5) so float windows stack as units without lower
   floats' chromes painting above higher floats' panels. */
.rails-floats {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* Content layer: panels. Pointer events enabled on individual panels only.
   No z-index here — each panel sets its own (rail panels at auto; float panels
   at 10 + float.z) so that float panels paint above rail panels at the same
   screen area, but below the floats layer (z:100) so the float frame
   (titlebar/strip/handles) still draws on top. */
.rails-content {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.rails-panel {
  position: absolute;
  pointer-events: auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  /* Transitions are structural — panels slide between positions on layout change.
     The .rails-dragging class disables transitions during active drags. */
  transition: left 140ms cubic-bezier(.4,.1,.2,1),
              top 140ms cubic-bezier(.4,.1,.2,1),
              width 140ms cubic-bezier(.4,.1,.2,1),
              height 140ms cubic-bezier(.4,.1,.2,1);
}

.rails-panel.rails-dragging {
  transition: none;
  pointer-events: none;
}

/* Docked tree. Every node (split or stack) is a flex child of its parent
   split; a split lays its children out in a row or a column, with a 6px
   resize bar between each pair. */
.rails-node {
  display: flex;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.rails-split.rails-row { flex-direction: row; }
.rails-split.rails-col { flex-direction: column; }

/* Minimum sizes along the parent's axis. */
.rails-row > .rails-node:not(.rails-collapsed) { min-width: 140px; }
.rails-col > .rails-node:not(.rails-collapsed) { min-height: 100px; }

/* Collapsed node: a 32px strip along its parent's axis. */
.rails-collapsed-row { flex-direction: column; }
.rails-collapsed-col { flex-direction: row; }

/* Collapse button: inline in the node's first strip-wrap, right of the
   overflow ⋯. Expand button: fills the collapsed 32px strip's start. */
.rails-collapse-btn {
  flex: 0 0 auto;
  width: 28px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: 1;
  padding: 0;
  user-select: none;
}

.rails-expand-btn {
  flex: 0 0 auto;
  cursor: pointer;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  line-height: 1;
  padding: 4px 0;
  user-select: none;
}
.rails-collapsed-row > .rails-expand-btn { width: 100%; }
.rails-collapsed-col > .rails-expand-btn { height: 100%; width: 32px; padding: 0; }

.rails-bar {
  flex: 0 0 6px;
  position: relative;
  z-index: 2;
  touch-action: none;
}
.rails-bar-row { cursor: col-resize; }
.rails-bar-col { cursor: row-resize; }

/* Stack — a tab group (docked, or inside a float). */
.rails-stack {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.rails-stack-in-float {
  flex: 1;
  min-height: 0;
}

/* Strip-wrap — holds the scrollable strip + overflow button side-by-side.
   Only present when tabs are rendered (always, in practice). */
.rails-strip-wrap {
  display: flex;
  flex-direction: row;
  flex-shrink: 0;
  min-height: 30px;
  pointer-events: auto;
}

/* Strip — the row of tab headers. Lives inside .rails-strip-wrap. */
.rails-strip {
  display: flex;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  pointer-events: auto;
}

.rails-overflow-btn {
  flex: 0 0 auto;
  cursor: pointer;
}
.rails-overflow-btn[hidden] { display: none; }

.rails-newtab-btn {
  flex: 0 0 auto;
  cursor: pointer;
}

.rails-strip:focus { outline: none; }

.rails-tab {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  white-space: nowrap;
  cursor: grab;
  user-select: none;
  touch-action: none;
  -webkit-touch-callout: none;
}

.rails-tab:active { cursor: grabbing; }
.rails-tab.rails-locked { cursor: default; }

.rails-tab-label {
  overflow: hidden;
  text-overflow: ellipsis;
}

.rails-tab-badge {
  flex-shrink: 0;
}

.rails-x {
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}

.rails-slot {
  flex: 1;
  min-height: 0;
  /* Pass-through to the panel below (panels live in contentLayer, floats'
     slots are transparent windows onto that layer). */
  pointer-events: none;
}

/* Empty workspace: the consumer's renderEmpty() element sits inside chrome. */
.rails-empty {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Floats ─────────────────────────────────────────────────────────── */

/* The float itself is pointer-transparent — its opaque children (titlebar,
   strip, resize handles) re-enable pointer events. This keeps the slot area
   click-through to the panel that lives in contentLayer behind the float.
   box-sizing: border-box so width/height from float.w/h include any border
   from the consumer theme — otherwise the border adds to the float's
   rendered size and the slot rect ends up offset from what panel positioning
   expects. */
.rails-float {
  position: absolute;
  box-sizing: border-box;
  pointer-events: none;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.rails-float.rails-maximized {
  /* Maximized floats fill workspace — position is set explicitly via inline
     style by toggleFloatMaximized. No structural CSS change needed here. */
}

/* Single-tab floats: hide the redundant in-stack strip. The titlebar already
   shows the tab title, and there are no peers to switch between. As soon as
   a second tab joins (drop on titlebar), the class is dropped on the next
   chrome rebuild and the strip reappears. */
.rails-float.rails-float-single-tab .rails-strip-wrap {
  display: none;
}

.rails-titlebar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  cursor: grab;
  user-select: none;
  position: relative;
  z-index: 1;
  touch-action: none;
  pointer-events: auto;
}

.rails-titlebar:active { cursor: grabbing; }

.rails-titlebar-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rails-titlebar-buttons {
  flex-shrink: 0;
  display: flex;
}

.rails-titlebar-buttons button {
  cursor: pointer;
}

/* Per-float handles overlay — sibling of .rails-float in floatsLayer, sized
   to match the float, but at a higher z so it paints above the panel. The
   overlay itself is pointer-transparent; only the 8 handle strips re-enable
   pointer events. Hidden when the float is minimized (no resize affordance
   on a collapsed-to-titlebar float). */
.rails-float-handles {
  position: absolute;
  box-sizing: border-box;
  pointer-events: none;
}
.rails-float-handles.rails-minimized {
  display: none;
}

/* Resize handles — 8 per float. Edges are 6px thick strips; corners are
   12×12 squares that overlap the edges and cover the true corners. */
.rails-resize-handle {
  position: absolute;
  touch-action: none;
  pointer-events: auto;
}
.rails-resize-handle-n { top: 0; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
.rails-resize-handle-s { bottom: 0; left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
.rails-resize-handle-e { right: 0; top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
.rails-resize-handle-w { left: 0; top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
.rails-resize-handle-ne { top: 0; right: 0; width: 12px; height: 12px; cursor: nesw-resize; }
.rails-resize-handle-nw { top: 0; left: 0; width: 12px; height: 12px; cursor: nwse-resize; }
.rails-resize-handle-se { bottom: 0; right: 0; width: 12px; height: 12px; cursor: nwse-resize; }
.rails-resize-handle-sw { bottom: 0; left: 0; width: 12px; height: 12px; cursor: nesw-resize; }

/* ── Drag UI ────────────────────────────────────────────────────────── */

/* Drag ghost: follows cursor. */
.rails-ghost {
  position: absolute;
  pointer-events: none;
  z-index: 10000;
  display: flex;
  align-items: center;
  white-space: nowrap;
}

/* Drop zones: overlays computed at drag start. */
.rails-zone {
  position: absolute;
  pointer-events: none;
  z-index: 500;
}

/* Scrim: captures pointer events during drag so iframes/canvases can't swallow them. */
.rails-scrim {
  position: absolute;
  inset: 0;
  z-index: 9500;
  cursor: grabbing;
  background: transparent;
}
</style>

/*
 * @gcu/rails — default theme
 * Optional decorative styling. Load after rails.css. Override any
 * --rails-* custom property to customize.
 */

:root {
  --rails-bg: #0f1114;
  --rails-surface: #16191e;
  --rails-chrome: #1f242c;
  --rails-border: #2a303a;
  --rails-border-strong: #3a4250;
  --rails-text: #d6dae1;
  --rails-text-dim: #8a93a3;
  --rails-text-faint: #5a6373;
  --rails-accent: #6ab0ff;
  --rails-accent-bg: rgba(106, 176, 255, 0.14);
  --rails-danger: #e07a6a;
  --rails-font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
}

.rails-root {
  background: var(--rails-bg);
  color: var(--rails-text);
  font-family: var(--rails-font-mono);
  font-size: 13px;
}

/* Docked tree + resize bars */
.rails-node { background: var(--rails-surface); }
.rails-node.rails-collapsed { background: var(--rails-chrome); }
.rails-collapsed-row { border-right: 1px solid var(--rails-border); }
.rails-collapsed-col { border-bottom: 1px solid var(--rails-border); }

.rails-collapse-btn {
  color: var(--rails-text-dim);
  font-size: 11px;
  border-left: 1px solid var(--rails-border);
  transition: color 80ms, background 80ms;
}
.rails-collapse-btn:hover {
  background: var(--rails-border);
  color: var(--rails-text);
}

.rails-expand-btn {
  color: var(--rails-text-dim);
  font-size: 11px;
  transition: color 80ms, background 80ms;
}
.rails-collapsed-row > .rails-expand-btn { height: 28px; }
.rails-expand-btn:hover {
  background: var(--rails-border);
  color: var(--rails-text);
}

.rails-bar { transition: background 80ms; }
.rails-bar-row { border-left: 1px solid var(--rails-border); margin-left: -1px; }
.rails-bar-col { border-top: 1px solid var(--rails-border); margin-top: -1px; }
.rails-bar:hover { background: var(--rails-accent-bg); }

/* Tab strip */
.rails-strip {
  background: var(--rails-chrome);
  border-bottom: 1px solid var(--rails-border);
  scrollbar-width: thin;
  scrollbar-color: var(--rails-border-strong) transparent;
}
.rails-strip::-webkit-scrollbar { height: 4px; }
.rails-strip::-webkit-scrollbar-thumb { background: var(--rails-border-strong); }

.rails-stack.rails-tabs-bottom .rails-strip {
  border-bottom: none;
  border-top: 1px solid var(--rails-border);
}

.rails-tab {
  padding: 7px 10px 7px 12px;
  font-size: 11px;
  color: var(--rails-text-dim);
  border-right: 1px solid var(--rails-border);
  gap: 8px;
  transition: color 80ms, background 80ms;
}
.rails-tab:hover { color: var(--rails-text); }
.rails-tab.rails-active {
  background: var(--rails-surface);
  color: var(--rails-text);
  box-shadow: inset 0 2px 0 var(--rails-accent);
}
.rails-stack.rails-tabs-bottom .rails-tab.rails-active {
  box-shadow: inset 0 -2px 0 var(--rails-accent);
}

.rails-tab-badge {
  font-size: 10px;
  line-height: 1;
  padding: 2px 5px;
  margin-left: 2px;
  border-radius: 8px;
  background: var(--rails-border);
  color: var(--rails-text-dim);
}
.rails-tab.rails-active .rails-tab-badge {
  background: var(--rails-accent);
  color: var(--rails-bg);
}

.rails-overflow-btn {
  width: 28px;
  border: none;
  border-left: 1px solid var(--rails-border);
  background: var(--rails-chrome);
  color: var(--rails-text-dim);
  font-family: inherit;
  font-size: 14px;
  line-height: 1;
  transition: color 80ms, background 80ms;
}
.rails-overflow-btn:hover {
  background: var(--rails-border);
  color: var(--rails-text);
}

.rails-newtab-btn {
  width: 28px;
  border: none;
  border-left: 1px solid var(--rails-border);
  background: var(--rails-chrome);
  color: var(--rails-text-dim);
  font-family: inherit;
  font-size: 17px;
  line-height: 1;
  transition: color 80ms, background 80ms;
}
.rails-newtab-btn:hover {
  background: var(--rails-border);
  color: var(--rails-text);
}

.rails-x {
  opacity: 0.4;
  font-size: 14px;
  line-height: 0.5;
  width: 12px;
  text-align: center;
  transition: opacity 80ms;
}
.rails-x:hover { opacity: 1; color: var(--rails-danger); }

/* Panel */
.rails-panel { background: var(--rails-surface); }

/* Ghost + drop zones */
.rails-ghost {
  background: var(--rails-chrome);
  border: 1px solid var(--rails-border-strong);
  padding: 5px 12px;
  font-size: 11px;
  color: var(--rails-text);
  border-radius: 3px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  opacity: 0.98;
}

.rails-zone { transition: background 80ms, box-shadow 80ms; border-radius: 2px; }
.rails-zone.rails-active {
  background: var(--rails-accent-bg);
  box-shadow: 0 0 0 1px var(--rails-accent);
}
.rails-zone.rails-zone-insert.rails-active {
  background: var(--rails-accent);
  box-shadow: none;
}
.rails-zone.rails-zone-split.rails-active {
  background: var(--rails-accent-bg);
  box-shadow: inset 0 0 0 2px var(--rails-accent);
}
.rails-zone.rails-zone-float.rails-active {
  background: transparent;
  outline: 2px dashed var(--rails-accent);
  outline-offset: -4px;
  box-shadow: none;
}

/* Floats — NO opaque background; the frame is a titlebar + strip + border.
   The slot area is click-through to the panel behind (which has its own bg). */
.rails-float {
  border: 1px solid var(--rails-border);
  border-radius: 3px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}
.rails-float.rails-minimized {
  height: auto !important;
}
.rails-float.rails-minimized .rails-stack {
  display: none;
}
/* Handles overlay is a sibling, not a descendant of .rails-float — its own
   .rails-minimized class is synced by toggleFloatMinimized. The structural
   `display: none` for that case lives in rails.css. */

.rails-titlebar {
  background: var(--rails-chrome);
  border-bottom: 1px solid var(--rails-border);
  padding: 4px 6px 4px 10px;
  min-height: 28px;
}

.rails-titlebar-label {
  font-size: 11px;
  color: var(--rails-text-dim);
  letter-spacing: 0.03em;
  padding-right: 8px;
}

.rails-titlebar-buttons button {
  width: 22px;
  height: 20px;
  border: none;
  background: transparent;
  color: var(--rails-text-dim);
  border-radius: 2px;
  font-family: inherit;
  font-size: 12px;
  line-height: 1;
  transition: background 80ms, color 80ms;
}
.rails-titlebar-buttons button:hover {
  background: var(--rails-border);
  color: var(--rails-text);
}
.rails-titlebar-buttons .rails-btn-close:hover {
  color: var(--rails-danger);
}

/* Resize handles — transparent, but a faint visual hint on hover. */
.rails-resize-handle {
  transition: background 80ms;
}
.rails-resize-handle:hover {
  background: var(--rails-accent-bg);
}

/* Empty workspace */
.rails-empty {
  color: var(--rails-text-faint);
  font-size: 12px;
}

/* Focus rings for keyboard nav */
.rails-tab:focus-visible {
  outline: 1px solid var(--rails-accent);
  outline-offset: -2px;
}
</style>

/*
 * @gcu/menu — structural stylesheet
 * Layout, positioning, pointer-events. Zero colors or fonts.
 * Decorative styling lives in menu-default.css (optional) or consumer CSS.
 */

.gcu-menu {
  position: fixed;
  /* Default 9000 sits well above rails floats (100-200 range) and any
     reasonable app chrome. Override via --ui-z-dropdown if needed. */
  z-index: var(--ui-z-dropdown, 9000);
  display: flex;
  flex-direction: column;
  min-width: 160px;
  max-width: 360px;
  max-height: 80vh;
  overflow-y: auto;
  overflow-x: hidden;
  user-select: none;
  pointer-events: auto;
}

.gcu-menu-submenu {
  /* same as root for now */
}

.gcu-menu-item {
  display: grid;
  grid-template-columns: 18px 18px 1fr auto 14px;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  cursor: pointer;
  white-space: nowrap;
}

.gcu-menu-item.gcu-menu-disabled {
  cursor: default;
  pointer-events: none;
}

.gcu-menu-check,
.gcu-menu-icon,
.gcu-menu-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.gcu-menu-icon img {
  width: 16px;
  height: 16px;
  display: block;
}

.gcu-menu-label {
  overflow: hidden;
  text-overflow: ellipsis;
}

.gcu-menu-shortcut {
  flex-shrink: 0;
}

.gcu-menu-sep {
  height: 1px;
  margin: 4px 0;
  pointer-events: none;
}

.gcu-menubar {
  display: flex;
  flex-direction: row;
  flex-shrink: 0;
  user-select: none;
}

.gcu-menubar-trigger {
  font: inherit;
  padding: 4px 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  .gcu-menu { transition: none; }
}
</style>

/*

 * @gcu/dialog — structural stylesheet
 * Layout, positioning, animation. Zero colors or fonts.
 * Decorative styling lives in dialog-default.css (optional) or consumer CSS.

.gcu-dialog-backdrop {
  position: fixed;

.wst-acts button, .wst-acts select { font:11px var(--w-sans); padding:2px 8px; border-radius:3px; border:1px solid var(--w-border); background:var(--w-bg-bright); color:var(--w-text); cursor:pointer; }
.wst-acts button:disabled { opacity:.45; cursor:default; }
.wst-acts button:focus-visible, .wst-acts select:focus-visible { outline:2px solid var(--w-blue); outline-offset:1px; }

/* a figure (compo's editor brings its own styles) */
.wfig-host { flex:1; min-height:0; display:flex; flex-direction:column; }

/* the console: @gcu/term (structure in term.css), coloured from wuffle's tokens so both themes follow */
.wcon { flex:1; min-height:0; overflow:hidden; padding:6px 8px; background:var(--w-net-bg); cursor:text; }
.wcon .screen { font:12px/1.4 var(--w-mono); color:var(--gcu-term-fg); background:var(--gcu-term-bg);
  --gcu-term-fg:var(--w-text); --gcu-term-bg:var(--w-net-bg); --gcu-term-cursor:var(--w-orange);
  --gcu-term-color-0:var(--w-bg-bright); --gcu-term-color-1:var(--w-red); --gcu-term-color-2:var(--w-green); --gcu-term-color-3:var(--w-orange);
  --gcu-term-color-4:var(--w-blue); --gcu-term-color-5:var(--w-violet); --gcu-term-color-6:var(--w-blue); --gcu-term-color-7:var(--w-text-mid);
  --gcu-term-color-8:var(--w-text-soft); --gcu-term-color-9:var(--w-red); --gcu-term-color-10:var(--w-green); --gcu-term-color-11:var(--w-yellow);
  --gcu-term-color-12:var(--w-blue); --gcu-term-color-13:var(--w-violet); --gcu-term-color-14:var(--w-blue); --gcu-term-color-15:var(--w-text); }
.wcon .screen .row { height:1.4em; }
.wcon .screen .cur { background:var(--gcu-term-cursor); }

/* the properties dialog */
.wprow { display:grid; grid-template-columns:130px 1fr; align-items:center; gap:10px; margin:6px 0; color:var(--w-text-mid); }
.wprow input, .wprow select { font:12px var(--w-mono); background:var(--w-bg-bright); color:var(--w-text); border:1px solid var(--w-border); border-radius:3px; padding:2px 6px; }
.wprow > select { min-width:0; width:100%; box-sizing:border-box; }   /* a long option (the column dialog's forms) stays inside its column */
.wprow input[type=color] { padding:0; height:24px; width:60px; }
.wpnote { margin:0 0 8px; font:11px var(--w-mono); color:var(--w-text-soft); }
.wpbar { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
.wpbar button { font:12px var(--w-sans); padding:3px 12px; border-radius:3px; border:1px solid var(--w-border); background:var(--w-bg-bright); color:var(--w-text); cursor:pointer; }

<style>
  :root {
    color-scheme: dark;
    /* Switchboard (ext/switchboard/SPEC.md) — layer 1, the swatches. A dark-only
       field tool: the basalt register lives on :root rather than [data-theme=dark]. */
    --sw-bg-deep:#0E1012; --sw-bg:#15171A; --sw-bg-raised:#1D2024; --sw-bg-bright:#25282D;
    --sw-text:#DDDCDA; --sw-text-mid:#9E9C98; --sw-text-soft:#83817E;
    --sw-border:#2F3338; --sw-border-soft:#24272B; --sw-rule:#3A3E44;
    --sw-orange:#FB9044; --sw-orange-soft:#2E2119; --sw-blue:#008CD1; --sw-blue-soft:#16262F;
    --sw-green:#5CCB80; --sw-green-soft:#1A261D; --sw-yellow:#FFD73A; --sw-yellow-soft:#292317;
    --sw-red:#E75A51; --sw-red-soft:#30201D; --sw-violet:#EC9FFF; --sw-violet-soft:#2A212C;
    --sw-radius:3px; --sw-radius-lg:4px; --sw-tap:44px;
    --sw-mono:"Space Mono","JetBrains Mono","Consolas",monospace; --sw-sans:"Barlow",system-ui,sans-serif;
    /* layer 2 — the semantic tokens the components below read: roles, never hues
       (orange=action · blue=info · green=go · yellow=caution · red=fault · violet=selected) */
    --au-bg:var(--sw-bg); --au-bg-deep:var(--sw-bg-deep); --au-panel:var(--sw-bg-raised); --au-well:var(--sw-bg-bright);
    --au-text:var(--sw-text); --au-text-mid:var(--sw-text-mid); --au-text-soft:var(--sw-text-soft);
    --au-border:var(--sw-border); --au-border-soft:var(--sw-border-soft); --au-rule:var(--sw-rule);
    --au-action:var(--sw-orange); --au-action-soft:var(--sw-orange-soft);
    --au-info:var(--sw-blue); --au-info-soft:var(--sw-blue-soft);
    --au-go:var(--sw-green); --au-go-soft:var(--sw-green-soft);
    --au-caution:var(--sw-yellow); --au-caution-soft:var(--sw-yellow-soft);
    --au-fault:var(--sw-red); --au-fault-soft:var(--sw-red-soft);
    --au-selected:var(--sw-violet); --au-selected-soft:var(--sw-violet-soft);
    --au-mono:var(--sw-mono); --au-sans:var(--sw-sans); --au-tap:var(--sw-tap);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0 auto; max-width:520px;
    padding: calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--au-bg); color:var(--au-text); font:15px/1.4 var(--au-sans); }
  h1 { font:600 15px var(--au-mono); margin:0 0 2px; color:var(--au-text); }
  .sub { color:var(--au-text-mid); font-size:12px; margin:0 0 12px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .top .brand { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .top .brand h1 { margin:0; }
  .top .brand .sub { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modes { display:flex; gap:0; border:1px solid var(--au-border); border-radius:9px; overflow:hidden; flex:none; }
  .modes button { padding:8px 13px; border:none; background:var(--au-panel); color:var(--au-text-mid); font:600 13px var(--au-sans); }
  .modes button.on { color:var(--au-selected); background:var(--au-selected-soft); }
  .modes button+button { border-left:1px solid var(--au-border); }

  /* the net IS the interface — reading + measure live in its dead corners */
  .net { position:relative; background:var(--au-panel); border:1px solid var(--au-border); border-radius:14px;
    padding:6px; margin-bottom:10px; }
  .net svg { width:100%; max-width:460px; height:auto; display:block; margin:0 auto; }
  .net .cap { position:absolute; top:14px; right:16px; text-align:right; pointer-events:none;
    color:var(--au-text-mid); font-size:10px; text-transform:uppercase; letter-spacing:.06em; line-height:1.3; }
  .readout { position:absolute; top:14px; left:16px; pointer-events:none; }
  .readout .rd { display:flex; align-items:baseline; gap:6px; }
  .readout .rd b { font:700 34px var(--au-mono); letter-spacing:-.02em; line-height:1.05; color:var(--au-text); }
  .readout .rd b small { font-size:16px; color:var(--au-text-mid); font-weight:400; }
  .readout .rd .label { color:var(--au-text-mid); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
  .readout .tilt { width:82px; height:4px; background:var(--au-bg-deep); border-radius:2px; margin-top:8px; overflow:hidden; }
  .readout .tilt i { display:block; height:100%; background:var(--au-go); width:0; }
  .fab { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom));
    right:calc(20px + env(safe-area-inset-right)); width:76px; height:76px; border:none; border-radius:50%;
    background:var(--au-action); color:var(--au-bg-deep); font:700 26px var(--au-sans); box-shadow:0 6px 18px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center; z-index:10; }
  .fab:active { filter:brightness(.88); transform:scale(.96); }
  .entry { display:flex; gap:6px; margin-bottom:10px; }
  .entry input { flex:1; min-width:0; padding:9px 12px; border:1px solid var(--au-border); border-radius:9px;
    background:var(--au-panel); color:var(--au-text); font:600 14px var(--au-mono); }
  .entry input::placeholder { color:var(--au-text-mid); font-weight:400; }
  .entry button { padding:9px 15px; border:1px solid var(--au-action); border-radius:9px; background:var(--au-action-soft);
    color:var(--au-action); font:600 14px var(--au-sans); }
  .actions { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .actions .count { font:12px var(--au-mono); color:var(--au-text-mid); }
  .actions button { padding:8px 13px; border:1px solid var(--au-border); background:var(--au-panel); color:var(--au-text);
    border-radius:8px; font:600 13px var(--au-sans); margin-left:6px; }
  .actions button#publish { border-color:var(--au-action); color:var(--au-action); }
  /* the net primitives (bearing emits classPrefix 'sn'). The primitive circle
     must be fill:none — an opaque fill paints OVER the grid + plotted data. */
  .net .sn-background { fill:var(--au-bg-deep); }
  .net .sn-primitive { fill:none; stroke:var(--au-rule); stroke-width:1.2; }
  .net .sn-grid { stroke:var(--au-border-soft); stroke-width:.7; fill:none; }
  .net .sn-cardinal { fill:var(--au-text-mid); }
  .net .sn-plane { fill:none; stroke-width:2.2; }
  .net .sn-line, .net .sn-pole { stroke-width:1.5; }
  .log { font:12px var(--au-mono); }
  .log ol { list-style:none; margin:0; padding:0; max-height:26vh; overflow:auto; }
  .log li { padding:7px 10px; border-left:3px solid var(--au-info); background:var(--au-panel); margin:3px 0;
    border-radius:0 6px 6px 0; display:flex; align-items:center; gap:8px; }
  .log li b { color:var(--au-text); font-weight:700; }
  .log li span { color:var(--au-text-mid); flex:1; }
  .log li .del { flex:none; width:26px; height:26px; border:none; border-radius:6px; background:transparent;
    color:var(--au-text-mid); font:400 18px system-ui; line-height:1; }
  .log li .del:active { background:var(--au-fault-soft); color:var(--au-fault); }
  #msg { color:var(--au-text-mid); font-size:12px; margin-top:8px; min-height:16px; }
  .warn { color:var(--au-action); }
  .vfoot { color:var(--au-text-soft); font-size:10px; margin-top:14px; text-align:right; letter-spacing:.04em; }
  .cam { position:fixed; inset:0; z-index:30; background:#000; display:flex; flex-direction:column; }
  .cam[hidden] { display:none; }
  .cam video { flex:1; width:100%; object-fit:cover; background:#000; }
  .camrow { display:flex; gap:12px; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); justify-content:space-between; background:var(--au-bg-deep); }
  .camrow button { flex:1; padding:14px; font:inherit; border:1px solid var(--au-border); border-radius:8px; background:var(--au-panel); color:var(--au-text); }
  .camrow button.primary { border-color:var(--au-action); color:var(--au-action); }
  .actions button#photo.has { border-color:var(--au-info); color:var(--au-info); }
  ol li .pic { margin-left:6px; color:var(--au-info); font-size:12px; }
  .strip { display:flex; gap:14px; min-height:16px; margin:-4px 0 8px; font-size:12px; color:var(--au-text-soft); letter-spacing:.02em; }
  .strip span:empty { display:none; }
  .strip button { font:inherit; font-size:12px; padding:2px 10px; margin-left:auto; background:none; color:var(--au-action); border:1px solid var(--au-action); border-radius:3px; }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1>wuffle</h1><span class="sub" id="brandsub">compass · magnetic N</span></div>
  <div class="modes">
    <button id="mPlane" class="on">plane</button>
    <button id="mLine">line</button>
  </div>
</div>
<!-- the status strip: position accuracy + which north the readings use; iOS's compass permission button -->
<div class="strip"><span id="pos"></span><span id="north"></span><button id="compassOn" hidden>enable compass</button></div>

<div class="net" id="net">
  <div id="netHost"></div>
  <div class="readout">
    <div class="rd"><b id="v1">—</b><span class="label" id="l1">dip dir</span></div>
    <div class="rd"><b id="v2">—</b><span class="label" id="l2">dip</span></div>
    <div class="tilt"><i id="lvl"></i></div>
  </div>
  <button class="fab" id="measure" aria-label="measure">◎</button>
  <div class="cap">Schmidt<br>lower hemi</div>
</div>

<div class="entry">
  <input id="manual" inputmode="numeric" placeholder="type e.g. 045/30 or 310→70 · Enter to plot">
  <button id="add">add</button>
</div>

<div class="actions">
  <span class="count" id="count">0 measurements</span>
  <button id="photo" title="photograph the outcrop for the last measurement">photo</button>
  <span><button id="clear">clear</button><button id="publish">publish →</button></span>
</div>

<div class="log">
  <ol id="list"></ol>
</div>
<div id="msg"></div>

<!-- the viewfinder: plain getUserMedia (environment camera) → canvas → JPEG -->
<div id="cam" class="cam" hidden>
  <video id="camv" autoplay playsinline muted></video>
  <div class="camrow">
    <button id="camx">cancel</button>
    <button id="snap" class="primary">capture</button>
  </div>
</div>
